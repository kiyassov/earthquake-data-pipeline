# Локальное окружение проекта: Airflow 3 с LocalExecutor,
# S3-совместимое хранилище RustFS и PostgreSQL для DWH.
# Только для разработки на своей машине, не для продакшена.
#
# Секреты и настройки берутся из файла .env рядом с этим файлом
# (шаблон: .env.example). Запись ${VAR:?текст} значит, что переменная
# обязательна: без неё docker compose не стартует и выведет этот текст.

name: earthquake-pipeline

# Общий блок для всех контейнеров Airflow. Ниже он подключается через <<: *airflow-common,
# чтобы не повторять одно и то же в каждом сервисе.
x-airflow-common: &airflow-common
  build: .
  image: earthquake-airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://${AIRFLOW_DB_USER:?set in .env}:${AIRFLOW_DB_PASSWORD:?set in .env}@airflow-postgres:5432/${AIRFLOW_DB_NAME:?set in .env}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set in .env}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set in .env}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?set in .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    # Connection к S3-хранилищу для DAG: conn_id = rustfs_s3, тип aws.
    # Ключи берутся из .env, адрес указывает на RustFS вместо AWS.
    AIRFLOW_CONN_RUSTFS_S3: '{"conn_type": "aws", "login": "${S3_ACCESS_KEY:?set in .env}", "password": "${S3_SECRET_KEY:?set in .env}", "extra": {"endpoint_url": "http://rustfs:9000", "region_name": "us-east-1"}}'
    # Variable с именем бакета для сырых данных: Variable.get("raw_bucket").
    AIRFLOW_VAR_RAW_BUCKET: ${S3_BUCKET:?set in .env}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:?set in .env (id -u)}:0"
  depends_on: &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy

services:
  # База метаданных Airflow: DAG runs, task instances, Connections, Variables.
  # Это не хранилище данных проекта: для него есть отдельный сервис dwh-postgres.
  airflow-postgres:
    image: postgres:17.12
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:?set in .env}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set in .env}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:?set in .env}
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Одноразовый контейнер: миграции базы метаданных и создание администратора.
  # Отрабатывает и завершается с кодом 0, после этого стартуют остальные сервисы.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs
        chown "${AIRFLOW_UID}:0" /opt/airflow/logs
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:?set in .env}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set in .env}
    user: "0:0"

  # Веб-интерфейс, REST API и Execution API, через который задачи
  # сообщают о своём статусе.
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Планировщик. С LocalExecutor он же и запускает задачи в своём контейнере.
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
      # Задачи пишут в бакет, поэтому запускать их можно только после того, как он создан.
      rustfs-init:
        condition: service_completed_successfully

  # Парсит файлы из ./dags и сохраняет DAG в базу метаданных.
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # S3-совместимое объектное хранилище: сюда DAG 1 будет класть Parquet.
  # MinIO использовать нельзя: проект архивирован, образы удалены с Docker Hub.
  # Для DuckDB, boto3 и Airflow это обычный S3, просто с другим адресом.
  rustfs:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
      RUSTFS_CONSOLE_ENABLE: "true"
      # Пустое значение: логи идут в stdout и видны в docker compose logs rustfs.
      RUSTFS_OBS_LOG_DIRECTORY: ""
    volumes:
      - rustfs-data:/data
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # веб-консоль
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Одноразовый контейнер: создаёт бакет, если его ещё нет, и завершается.
  # aws-cli выбран намеренно: это стандартный S3-клиент, те же команды работают с AWS.
  rustfs-init:
    image: amazon/aws-cli:2.39.3
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set in .env}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET:?set in .env}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        if aws s3api head-bucket --bucket "$${S3_BUCKET}" 2>/dev/null; then
          echo "Bucket $${S3_BUCKET} already exists"
        else
          aws s3api create-bucket --bucket "$${S3_BUCKET}"
          echo "Bucket $${S3_BUCKET} created"
        fi
    depends_on:
      rustfs:
        condition: service_healthy

  # Хранилище данных (DWH): сюда DAG 2 загрузит данные, здесь же будут работать dbt и Metabase.
  # Это отдельный сервер, не база метаданных Airflow.
  dwh-postgres:
    image: postgres:17.12
    environment:
      POSTGRES_USER: ${DWH_DB_USER:?set in .env}
      POSTGRES_PASSWORD: ${DWH_DB_PASSWORD:?set in .env}
      POSTGRES_DB: ${DWH_DB_NAME:?set in .env}
    volumes:
      - dwh-postgres-data:/var/lib/postgresql/data
    ports:
      # 5433 на хосте, чтобы не конфликтовать с локальным Postgres на 5432.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  airflow-postgres-data:
  rustfs-data:
  dwh-postgres-data:
